# ============================================================
# BUILD SETTINGS
# ============================================================
[build]
  command   = "npm run build"
  publish   = ".next"

[build.environment]
  NODE_VERSION              = "20"
  NEXT_TELEMETRY_DISABLED   = "1"

# ============================================================
# NEXT.JS PLUGIN
# ============================================================
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ============================================================
# HEADERS (security)
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=(self), payment=(self 'https://js.stripe.com')"
    X-XSS-Protection          = "1; mode=block"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # Content Security Policy
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://js.stripe.com https://cdn.sanity.io;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob: https://cdn.sanity.io https://*.supabase.co https://images.unsplash.com;
      frame-src https://js.stripe.com https://hooks.stripe.com;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://api.resend.com https://cdn.sanity.io;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      upgrade-insecure-requests;
    """

# Headers for admin routes (extra noindex)
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Headers for API routes
[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store, max-age=0"

# Long-lived caching for static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ============================================================
# REDIRECTS
# ============================================================

# Root → French locale (primary)
[[redirects]]
  from   = "/"
  to     = "/fr"
  status = 301
